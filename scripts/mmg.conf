server {
    listen 80;
    server_name mmgcrpg-server.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mmgcrpg-server.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mmgcrpg-server.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmgcrpg-server.duckdns.org/privkey.pem;

    # WebServer handles combat init and finish
    location = /api/pb/combat/start {
        proxy_pass http://webserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/pb/combat/[0-9]+/finish {
        proxy_pass http://webserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CombatServer handles tick, command, log, summary, speed
    location /api/pb/combat/ {
        proxy_pass http://combatserver:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else goes to WebServer
    location / {
        proxy_pass http://webserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
